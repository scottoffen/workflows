# Static analysis for the reusable workflows in this repo.
#
# Why this exists: a typo or undeclared-input reference in a reusable
# workflow does not fail at merge time; it fails when a downstream consumer
# next runs the workflow, which could be days later and in a repo whose
# owner is not watching the build queue. actionlint catches the common
# classes of mistake before the PR lands here, so v0 never advances onto a
# broken commit.
#
# Triggers on every PR (gating mechanism) and on workflow_dispatch (for
# ad-hoc reruns and for sanity-checking after force-updating the moving
# tags).
name: Lint workflows

on:
  pull_request:
  workflow_dispatch:

# Cancel earlier in-progress runs for the same PR when a new commit lands;
# only the latest commit's lint result is interesting.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    # Default GITHUB_TOKEN permissions are fine here. The lint step does
    # not write to the repo, push packages, or read secrets; it only reads
    # the checked-out files.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rhysd/actionlint does not publish a `uses:` action, so we run the
      # binary via the project's download script, which is the approach it
      # recommends for CI. The script is the faster option: it fetches a
      # single small Go binary rather than pulling the official Docker image,
      # which also bundles shellcheck and pyflakes and so costs more to pull
      # on every PR run. shellcheck is already pre-installed on the ubuntu
      # runner, so actionlint's shellcheck integration still works.
      #
      # The download script writes the binary path to its `executable` output,
      # which the next step invokes. The version is pinned as the script's
      # first argument so the bump shows up in code review. Note that
      # Dependabot does not track versions embedded in run scripts, so this
      # one gets bumped by hand.
      #
      # No config file is committed yet. If actionlint produces noisy findings
      # we disagree with, add a .github/actionlint.yaml and, under a `paths`
      # entry keyed by a file glob, give it an `ignore` list of regexes that
      # match the error messages to filter out. This is the file-based
      # equivalent of the -ignore flag and keeps the suppressions visible in
      # code review. Note it filters on the message text, not on rule names,
      # so there is no switch to turn a whole rule off.
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.11
        shell: bash

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash